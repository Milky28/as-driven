name: Submit a simulator observation
description: Share one guided-drive JSON draft for maintainer review.
title: "[Observation]: "
labels:
  - contribution
  - observation-received
body:
  - type: markdown
    attributes:
      value: |
        A guided drive records one simulator implementation. It does not establish the real car's identity, prove authenticity, or guarantee that a record will be added.

        Submit one draft per issue. A maintainer validates the file, checks identity and real-car evidence, and decides whether it corroborates, contradicts, corrects, or extends the curated data.

        The issue and attachment are public. Use the marked redacted copy if you do not want the observer name or Assetto Corsa package details included. Linked third-party sources remain their owners' property.

        **Title:** Keep the `[Observation]:` prefix and add the simulator and telemetry car name, for example `[Observation]: AMS2 - Chevrolet Cruze Stock Car 2021`. When opened directly after saving a drive, As Driven fills this in for you.

  - type: textarea
    id: observation
    attributes:
      label: Guided-drive draft JSON
      description: Drag the exact As Driven JSON into this box, or click to select it. GitHub will insert an attachment link. You may attach the marked redacted copy instead. Do not attach logs or game files.
      placeholder: Drop one .json draft here. Wait for the upload to finish before submitting.
    validations:
      required: true

  - type: dropdown
    id: intent
    attributes:
      label: What prompted this observation?
      options:
        - A car or implementation not currently recognized
        - A second drive that may corroborate an existing result
        - A result that may correct an existing simulator view
        - Another mod or package depicting an already-curated car
        - A requested drive from the project coverage plan
    validations:
      required: true

  - type: textarea
    id: proposed-identity
    attributes:
      label: What exact real car do you believe this depicts?
      description: Optional. Include model year, generation, racing specification, or homologation class when known. "I don't know" is an acceptable answer.
      placeholder: "Example: 2018-Spec Nissan GT-R NISMO GT3, not the 2015 car."

  - type: textarea
    id: identity-evidence
    attributes:
      label: Identity or real-car evidence
      description: Optional. Link manufacturer pages, manuals, regulations, homologation forms, or official mod documentation. Explain what each link establishes; do not paste protected documents or long extracts.

  - type: textarea
    id: uncertainty
    attributes:
      label: Uncertainty or reviewer notes
      description: Optional. Mention nearby generations, unusual cockpit hardware, questionable telemetry, failed tests, or anything that should be repeated.

  - type: checkboxes
    id: permission
    attributes:
      label: Permission to share
      options:
        - label: I may share this draft publicly, and I license my own observations and notes under CC BY 4.0.
          required: true
