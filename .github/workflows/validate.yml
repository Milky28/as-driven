name: Validate data

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m as_driven_db validate
      - run: python -m unittest discover -s tests -v

  package-database:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - shell: powershell
        run: .\release\build-database.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: database-release-candidate
          path: |
            dist/database/*.zip
            dist/database/*.sha256
